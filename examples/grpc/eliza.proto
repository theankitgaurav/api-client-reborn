syntax = "proto3";

package connectrpc.eliza.v1;

service ElizaService {
  rpc Say(SayRequest) returns (SayResponse);
  rpc Introduce(IntroduceRequest) returns (stream IntroduceResponse);
  rpc Converse(stream ConverseRequest) returns (stream ConverseResponse);
}

message SayRequest { string sentence = 1; }
message SayResponse { string sentence = 1; }
message IntroduceRequest { string name = 1; }
message IntroduceResponse { string sentence = 1; }
message ConverseRequest { string sentence = 1; }
message ConverseResponse { string sentence = 1; }
