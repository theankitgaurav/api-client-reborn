syntax = "proto3";

package api.v1;

service UserService {
  rpc GetUser (UserRequest) returns (UserResponse);
  rpc Echo (EchoRequest) returns (EchoResponse);
}

message UserRequest {
  int32 id = 1;
}

message UserResponse {
  int32 id = 1;
  string name = 2;
  string email = 3;
  string role = 4;
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
  int64 timestamp = 2;
}
