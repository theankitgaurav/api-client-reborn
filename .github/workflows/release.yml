name: Release API Client Reborn

on:
  push:
    tags:
      - 'v*'
  # Dry run: tests and builds every platform without creating or publishing a release.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux build dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Run verification checks & tests
        run: npm run test

  prepare:
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      release_notes: ${{ steps.draft.outputs.release_notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag matches project versions
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          expected="${RELEASE_TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo="$(awk '/^\[package\]/ { p = 1; next } /^\[/ { p = 0 } p && /^version[[:space:]]*=/ { gsub(/.*=[[:space:]]*"|".*/, ""); print; exit }' src-tauri/Cargo.toml)"
          status=0
          for entry in "package.json=$pkg" "src-tauri/tauri.conf.json=$conf" "src-tauri/Cargo.toml=$cargo"; do
            if [ "${entry#*=}" != "$expected" ]; then
              echo "Version mismatch in ${entry%%=*}: found '${entry#*=}', tag expects '$expected'" >&2
              status=1
            fi
          done
          exit $status

      - name: Create or reuse draft release
        if: github.event_name == 'push'
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ -z "$(tr -d '[:space:]' < "$RUNNER_TEMP/release-notes.md")" ]; then
            echo "Missing changelog entry for $RELEASE_TAG" >&2
            exit 1
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag) | {databaseId: .id, isDraft: .draft}]' \
            > "$RUNNER_TEMP/matching-releases.json"
          count="$(jq 'length' "$RUNNER_TEMP/matching-releases.json")"
          if [ "$count" -gt 1 ]; then
            echo "Multiple releases found for $RELEASE_TAG; resolve them before retrying." >&2
            exit 1
          elif [ "$count" -eq 1 ]; then
            jq '.[0]' "$RUNNER_TEMP/matching-releases.json" > "$RUNNER_TEMP/release.json"
            if [ "$(jq -r '.isDraft' "$RUNNER_TEMP/release.json")" != "true" ]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace its assets." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "API Client Reborn $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release view "$RELEASE_TAG" --json databaseId,isDraft > "$RUNNER_TEMP/release.json"
          fi
          echo "release_id=$(jq -r '.databaseId' "$RUNNER_TEMP/release.json")" >> "$GITHUB_OUTPUT"
          {
            echo 'release_notes<<RELEASE_NOTES_EOF'
            cat "$RUNNER_TEMP/release-notes.md"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  release:
    needs: [test, prepare]
    if: ${{ !cancelled() && needs.test.result == 'success' && (needs.prepare.result == 'success' || github.event_name != 'push') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # The action reads and replaces a shared latest.json; serialize its writers.
      max-parallel: 1
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Tauri App & Draft Release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseBody: ${{ needs.prepare.outputs.release_notes }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build Tauri App (dry run)
        if: github.event_name != 'push'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload dry-run bundles
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: src-tauri/target/**/release/bundle/**
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: release
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate updater metadata and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json tagName,isDraft,assets > "$RUNNER_TEMP/release.json"
          mkdir "$RUNNER_TEMP/updater-assets"
          gh release download "$RELEASE_TAG" --pattern latest.json --pattern '*.sig' --dir "$RUNNER_TEMP/updater-assets"
          node .github/scripts/validate-release.mjs "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/updater-assets" "$RUNNER_TEMP/release.json"
          gh release edit "$RELEASE_TAG" --draft=false

  # Remove a draft left by a failed or cancelled run; published releases are never touched.
  cleanup:
    needs: [prepare, release, publish]
    if: ${{ (failure() || cancelled()) && github.event_name == 'push' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Delete leftover draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          ids="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft) | .id")"
          for id in $ids; do
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
          done
