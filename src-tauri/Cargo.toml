[package]
name = "api_client_reborn"
version = "0.1.0"
description = "A lightweight native API client for macOS, Windows, and Linux"
authors = ["API Client Authors"]
license = "MIT"
edition = "2021"
default-run = "api_client_reborn"

[lib]
name = "api_client_reborn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-fs = "2.0.0"

# Async & Networking
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json", "gzip", "brotli"] }
bytes = "1.6"
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# Utilities
shlex = "1.3"
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
rand = "0.8"
dirs = "5.0"
protox = "0.9.1"
prost = "0.14.4"
prost-types = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
tonic = { version = "0.14.6", default-features = false, features = ["transport", "channel", "server", "router"] }
tonic-reflection = "0.14.6"
http = "1.0"
http-body = "1.0"
tower = "0.5"
http-body-util = "0.1"
h2 = "0.4"
